name: DyLab
options:
  bundleIdPrefix: com.dylab
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  DyLab:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DyLabApp/Sources
      - path: DyLabApp/Bridge
      - path: Deps/zstd/zstddeclib.c
      - path: DyLabApp/Resources
        buildPhase: resources
        excludes:
          - SDK/**
      - path: DyLabApp/Resources/SDK
        type: folder
        buildPhase: resources
    info:
      path: DyLabApp/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.debian.deb-archive
            UTTypeDescription: Debian Package
            UTTypeConformsTo:
              - public.data
              - public.archive
              - public.item
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - deb
          - UTTypeIdentifier: com.apple.mach-o-dylib
            UTTypeDescription: Mach-O Dynamic Library
            UTTypeConformsTo:
              - public.data
              - public.unix-executable
              - public.executable
              - public.item
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - dylib
        CFBundleDocumentTypes:
          - CFBundleTypeName: Debian Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.debian.deb-archive
            CFBundleTypeExtensions:
              - deb
          - CFBundleTypeName: Mach-O Dynamic Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.mach-o-dylib
            CFBundleTypeExtensions:
              - dylib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylab.app
        PRODUCT_NAME: DyLab
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_OBJC_BRIDGING_HEADER: DyLabApp/Bridge/DyLab-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Deps/zstd
          - $(SRCROOT)/Deps/capstone-ios/include
          - $(SRCROOT)/Deps/tcc-ios/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Deps/capstone-ios/lib
          - $(SRCROOT)/Deps/tcc-ios/lib
        OTHER_LDFLAGS:
          - -lcapstone
          - -ltcc
          - -lc++
          - -lcompression
          - -lz
          - -lbz2
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_ENABLE_MODULES: YES
