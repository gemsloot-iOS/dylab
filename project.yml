name: DyLab
options:
  bundleIdPrefix: com.dylab
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  DyLab:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DyLabApp/Sources
      - path: DyLabApp/Bridge
      - path: DyLabApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylab.app
        PRODUCT_NAME: DyLab
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_OBJC_BRIDGING_HEADER: DyLabApp/Bridge/DyLab-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Deps/wamr-ios/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Deps/wamr-ios/lib
        OTHER_LDFLAGS:
          - -liwasm
          - -lc++
          - -lcompression
          - -lz
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_ENABLE_MODULES: YES
